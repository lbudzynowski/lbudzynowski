name: Restore e-paper gallery

on:
  push:
    branches:
      - fix/restore-sharp-epaper-gallery
    paths:
      - ".tmp-gallery/**"
      - ".github/workflows/restore-gallery.yml"

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-sharp-epaper-gallery
          fetch-depth: 0

      - name: Decode and verify images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/epaper-calendar-dashboard

          cat .tmp-gallery/hardware.*.b64 | base64 --decode > assets/epaper-calendar-dashboard/hardware-as-delivered.jpg
          cat .tmp-gallery/live.*.b64 | base64 --decode > assets/epaper-calendar-dashboard/live-calendar-battery-redacted.jpg
          cat .tmp-gallery/glyphs.*.b64 | base64 --decode > assets/epaper-calendar-dashboard/polish-glyphs-before-after.jpg

          echo "b4e86250860ebddeecfcc6a6c8433de1543e275ab2ba898ab2f0eecedd898aa6  assets/epaper-calendar-dashboard/hardware-as-delivered.jpg" | sha256sum -c -
          echo "e9b7dbc565e8e4f54c0f04917d40448395cadb55e5a0d56e2119b49367fbd5a1  assets/epaper-calendar-dashboard/live-calendar-battery-redacted.jpg" | sha256sum -c -
          echo "f61ccfcb85ee29fd438317dba0082a8d49542191ab6347352433ddfe185ca9a3  assets/epaper-calendar-dashboard/polish-glyphs-before-after.jpg" | sha256sum -c -

          file assets/epaper-calendar-dashboard/*.jpg

          rm -rf .tmp-gallery
          rm -f .github/workflows/restore-gallery.yml

      - name: Commit restored gallery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore sharp e-paper gallery images"
          git push origin HEAD:fix/restore-sharp-epaper-gallery
